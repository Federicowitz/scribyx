<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WriteX</title>
    <script>
      (function () {
        var base = '/';
        var path = window.location.pathname;
        var params = new URLSearchParams(window.location.search);
        var hash = window.location.hash || '';

        // Keep old shared links working after moving to the custom domain root.
        if (path === '/cloud' || path === '/cloud/' ||
            path === '/scribyx/cloud' || path === '/scribyx/cloud/') {
          params.set('cloud', '1');
        }

        var search = params.toString();
        window.location.replace(base + (search ? '?' + search : '') + hash);
      })();
    </script>
  </head>
  <body></body>
</html>
